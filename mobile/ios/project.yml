name: SoteriaAssurance
options:
  bundleIdPrefix: com.soteria
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true

targets:
  SoteriaAssurance:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soteria.assurance
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Soteria Assurance
        SWIFT_VERSION: '5.0'

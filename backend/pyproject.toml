[project]
name = "forge-backend"
version = "0.1.0"
description = "Soteria Forge API: Django on Railway (see docs/forge-platform-plan.md)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django~=6.1.2",
  "djangorestframework~=3.18.3",
  "drf-spectacular~=0.30.0",
  "django-cors-headers~=4.9",
  "dj-database-url~=3.1.2",
  "psycopg[binary]~=3.3.6",
  "firebase-admin~=7.7.0",
  "gunicorn~=23.0",
  "uvicorn~=0.38",
  "whitenoise~=6.11",
  "sentry-sdk[django]~=2.43",
]

[dependency-groups]
dev = [
  "pytest~=8.4",
  "pytest-django~=4.14.0",
  "ruff~=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "forge.settings_test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

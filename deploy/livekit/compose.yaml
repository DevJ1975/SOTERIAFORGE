# Dedicated Linux VPS only. Host networking is required for public ICE candidates.
name: forge-media

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command:
      [
        'redis-server',
        '--bind',
        '127.0.0.1',
        '--protected-mode',
        'yes',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    network_mode: host
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'redis-cli', '-h', '127.0.0.1', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ['--config', '/etc/livekit.yaml']
    network_mode: host
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./runtime/livekit.yaml
        target: /etc/livekit.yaml
        read_only: true
        bind:
          create_host_path: false
    logging: *logging

  caddy:
    image: livekit/caddyl4@sha256:9dd090159a6042a907dbff0ce9dda27a21d2a559dc7b03b60a8e6b1b60b8348e
    command: ['run', '--config', '/etc/caddy.json']
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit
    volumes:
      - type: bind
        source: ./runtime/caddy.json
        target: /etc/caddy.json
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
    logging: *logging

volumes:
  caddy-data:

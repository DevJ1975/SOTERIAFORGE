name: CI

on:
  push:
    # main is production; feat/angular-22-upgrade deploys staging on Railway, which
    # waits for this workflow ("Wait for CI") before it builds.
    branches: [main, feat/angular-22-upgrade]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Format check
        run: npx prettier --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npx nx run-many -t lint --parallel=3

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Test
        run: npx nx run-many -t test --parallel=2 --ci --coverage
      - name: Build-script tests
        run: node --test scripts/*.test.mjs

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        project: [learner, admin, superadmin, storefront]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      # One project per runner: no build-time memory contention, and a failing
      # matrix leg names the exact project.
      - name: Build ${{ matrix.project }}
        run: |
          set +e
          npx nx build ${{ matrix.project }} 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
      # Surface the actual error (CI-only failures we cannot otherwise inspect).
      - name: Report build failure
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$(printf '### CI build (%s) failed\n\n```\n%s\n```\n' '${{ matrix.project }}' "$(tail -c 8000 /tmp/build.log)")"

  # E2E needs a served app + browsers; run on main pushes and manual dispatch,
  # not on every PR (the learner-e2e project is still linted in the lint job).
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx nx e2e learner-e2e

  # The simulator rules (rust/README.md): test them, then build the Python module
  # the backend job installs, so Django's replay tests run against this commit's rules.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format check
        working-directory: rust
        run: cargo fmt --check
      - name: Lint
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --locked
      # manylinux 2_28 runs on the API image (python:3.13-slim) and on this runner.
      - name: Build the forge_sim wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          manylinux: 2_28
          args: --release --locked -m rust/forge-sim-py/Cargo.toml -i python3.13 --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: forge-sim-wheel
          path: dist/*.whl
          if-no-files-found: error

  backend:
    needs: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://forge:forge@localhost:5433/forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: forge-sim-wheel
          path: backend/dist
      # Not in pyproject.toml yet, so install it beside the locked dependencies.
      # `uv run` keeps it; the import fails the job if the wheel doesn't load, which
      # would otherwise only show as skipped tests.
      - name: Install the forge_sim wheel
        run: uv pip install dist/*.whl && uv run python -c "import forge_sim; print('rules', forge_sim.RULES_VERSION)"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations are committed
        run: DJANGO_DEBUG=true uv run python manage.py makemigrations --check --dry-run
      - name: Test
        run: uv run pytest
      # backend/openapi.json is the contract the zod schemas in libs/shared are tested
      # against (learning-contract.spec.ts), so it must match the code.
      - name: OpenAPI schema is valid and committed
        run: |
          DJANGO_DEBUG=true uv run python manage.py spectacular --validate --fail-on-warn \
            --format openapi-json --file openapi.json
          git diff --exit-code -- openapi.json || {
            echo "::error::backend/openapi.json is stale. Regenerate it (see libs/shared/src/lib/schemas/learning-contract.spec.ts) and commit it."
            exit 1
          }

  # Railway builds these images; build them here first so a Dockerfile break fails CI,
  # not a deploy. Nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: learner
            context: .
            file: Dockerfile
            args: |
              APP=learner
              FORGE_API_BASE_URL=https://api.staging.soteriaforge.com
              FORGE_ROOT_DOMAIN=staging.soteriaforge.com
          - name: storefront
            context: .
            file: docker/storefront.Dockerfile
            args: |
              FORGE_ROOT_DOMAIN=staging.soteriaforge.com
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          tags: forge-${{ matrix.name }}:ci
          load: true
          push: false
      - name: Django deploy checks
        if: matrix.name == 'api'
        run: |
          docker run --rm -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgres://ci:ci@localhost:5432/ci \
            -e DJANGO_ALLOWED_HOSTS=api.staging.soteriaforge.com \
            -e EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend \
            forge-api:ci python manage.py check --deploy --fail-level WARNING
      - name: Bundle points at the build-time API
        if: matrix.name == 'learner'
        run: |
          docker run --rm forge-learner:ci sh -c \
            "grep -l 'api.staging.soteriaforge.com' /usr/share/nginx/html/main-*.js"
